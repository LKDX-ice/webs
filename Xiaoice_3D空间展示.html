            initPixelGrid();
            applySpectrumSettingsToVisualizer();

            // ================================================================
            //  十五、智能页面内容构建
            // ================================================================
            function getImageRatio(u) {
                return new Promise(res => {
                    const i = new Image();
                    i.onload = () => res(i.width / i.height);
                    i.onerror = () => res(1);
                    i.src = u;
                });
            }

            async function buildPageList(imgs) {
                const p = [];
                let pend = null;
                for (const u of imgs) {
                    const r = await getImageRatio(u);
                    if (r >= 1) {
                        if (pend) {
                            p.push([pend, u]);
                            pend = null;
                        } else pend = u;
                    } else {
                        if (pend) {
                            p.push(pend);
                            pend = null;
                        }
                        p.push(u);
                    }
                }
                if (pend) p.push(pend);
                return p;
            }

            function buildPageContent(data, div, idx, total) {
                div.innerHTML = '';
                div.className = 'content';
                if (typeof data === 'string') {
                    const img = document.createElement('img');
                    img.src = data;
                    div.classList.add('single-landscape');
                    div.appendChild(img);
                } else if (Array.isArray(data) && data.length === 2) {
                    div.classList.add('double-landscape');
                    data.forEach(s => {
                        const slot = document.createElement('div');
                        slot.className = 'img-slot';
                        const img = document.createElement('img');
                        img.src = s;
                        slot.appendChild(img);
                        div.appendChild(slot);
                    });
                }
                const toggle = document.createElement('div');
                toggle.className = 'flip-mode-toggle';
                if (flipMode === 'manual') toggle.classList.add('manual');
                toggle.textContent = '₪';
                toggle.title = '点击切换 自动/手动 翻页';
                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (flipMode === 'auto') {
                        flipMode = 'manual';
                        stopAutoFlip();
                        document.querySelectorAll('.flip-mode-toggle').forEach(el => el.classList.add('manual'));
                    } else {
                        flipMode = 'auto';
                        startAutoFlip();
                        document.querySelectorAll('.flip-mode-toggle').forEach(el => el.classList.remove('manual'));
                    }
                });
                div.appendChild(toggle);
            }

            // ================================================================
            //  十六、翻页组件
            // ================================================================
            function setupFlipbook(book) {
                const fb = document.getElementById('flipbook');
                fb.innerHTML = '';
                const pData = book.userData.pages;
                if ($('#flipbook').data('turn')) $('#flipbook').turn('destroy');
                buildPageList(pData).then(pList => {
                    pList.forEach((pi, idx) => {
                        const d = document.createElement('div');
                        d.className = 'page';
                        const c = document.createElement('div');
                        c.className = 'content';
                        d.appendChild(c);
                        fb.appendChild(d);
                        buildPageContent(pi, c, idx, pList.length);
                    });
                    try {
                        $('#flipbook').turn({
                            width: 700,
                            height: 480,
                            autoCenter: true,
                            gradients: true,
                            elevation: 50,
                            duration: 600,
                            page: 1
                        });
                        $('.page').off('click').on('click', function (e) {
                            if (isClosing || flipMode !== 'manual') return;
                            const half = $(this).width() / 2;
                            const x = e.pageX - $(this).offset().left;
                            if (x < half) $('#flipbook').turn('previous');
                            else $('#flipbook').turn('next');
                            if (flipMode === 'auto') resetAutoFlipTimer();
                        });
                        if (flipMode === 'auto') startAutoFlip();
                    } catch (e) { console.warn(e); }
                });
            }

            function startAutoFlip() {
                stopAutoFlip();
                autoFlipInterval = setInterval(() => {
                    if (isClosing || flipMode !== 'auto') return;
                    const total = $('#flipbook').turn('pages'),
                        cur = $('#flipbook').turn('page');
                    if (cur < total) $('#flipbook').turn('next');
                    else stopAutoFlip();
                }, 700);
            }

            function stopAutoFlip() {
                if (autoFlipInterval) {
                    clearInterval(autoFlipInterval);
                    autoFlipInterval = null;
                }
            }

            function resetAutoFlipTimer() {
                stopAutoFlip();
                autoFlipInterval = setTimeout(() => startAutoFlip(), 4000);
            }

            // ================================================================
            //  十七、核心动画函数（书本相关）
            // ================================================================
            function takeBookToDesk(book) {
                if (animating) return;
                animating = true;
                viewReset = false;
                document.getElementById('hint').classList.add('hidden');
                bookOnDesk = book;
                const startPos = book.position.clone();
                const frontPos = new THREE.Vector3(startPos.x, startPos.y, 1.6);
                const totalDuration = 1800;
                const startTime = Date.now();

                function anim() {
                    const elapsed = Date.now() - startTime;
                    const t = Math.min(elapsed / totalDuration, 1);
                    if (t < 0.5) {
                        const phase = t / 0.5;
                        const ease = phase < 0.5 ? 2 * phase * phase : 1 - Math.pow(-2 * phase + 2, 2) / 2;
                        book.position.lerpVectors(startPos, frontPos, ease);
                        book.rotation.set(0, 0, 0);
                    } else if (t < 0.75) {
                        const phase = (t - 0.5) / 0.25;
                        const ease = 1 - Math.pow(1 - phase, 3);
                        book.position.copy(frontPos);
                        book.rotation.x = (-Math.PI / 2) * ease;
                    } else {
                        const phase = (t - 0.75) / 0.25;
                        const ease = 1 - Math.pow(1 - phase, 3);
                        book.position.lerpVectors(frontPos, deskTargetPos, ease);
                        book.rotation.x = -Math.PI / 2;
                        book.rotation.y = 0;
                        book.rotation.z = 0;
                        book.scale.set(1 + (1 - ease) * 0.02, 1 + (1 - ease) * 0.02, 1 + (1 - ease) * 0.02);
                    }
                    if (t < 1) requestAnimationFrame(anim);
                    else {
                        book.position.copy(deskTargetPos);
                        book.rotation.set(-Math.PI / 2, 0, 0);
                        book.scale.set(1, 1, 1);
                        book.userData.isOnDesk = true;
                        book.userData.isOpen = false;
                        animating = false;
                        isZoomed = false;
                        document.getElementById('hint').textContent = '📖 点击书本 · 进入阅读';
                        document.getElementById('hint').classList.remove('hidden');
                    }
                }
                anim();
            }

            function zoomToBook(book) {
                if (animating || isZoomed) return;
                animating = true;
                isZoomed = true;
                viewReset = false;
                document.getElementById('hint').classList.add('hidden');
                const targetLook = deskTargetPos.clone();
                const startPos = camera.position.clone(),
                    startTarget = controls.target.clone();
                const totalDuration = 2000;
                const startTime = Date.now();
                const phase1End = new THREE.Vector3(0, 3.5, 7.5),
                    phase2End = new THREE.Vector3(0, 5.5, 3.2),
                    phase3End = new THREE.Vector3(0, 3.2, 3.0);
                const phase1Target = new THREE.Vector3(0, 2.5, 2.8);

                function step() {
                    const t = Math.min((Date.now() - startTime) / totalDuration, 1);
                    let cp, ct;
                    if (t < 0.35) {
                        const p = t / 0.35;
                        const e = 1 - Math.pow(1 - p, 3);
                        cp = new THREE.Vector3().lerpVectors(startPos, phase1End, e);
                        ct = new THREE.Vector3().lerpVectors(startTarget, phase1Target, e);
                    } else if (t < 0.7) {
                        const p = (t - 0.35) / 0.35;
                        const e = 1 - Math.pow(1 - p, 3);
                        cp = new THREE.Vector3().lerpVectors(phase1End, phase2End, e);
                        ct = new THREE.Vector3().lerpVectors(phase1Target, targetLook, e);
                    } else {
                        const p = (t - 0.7) / 0.3;
                        const e = 1 - Math.pow(1 - p, 3);
                        cp = new THREE.Vector3().lerpVectors(phase2End, phase3End, e);
                        ct = targetLook.clone();
                    }
                    camera.position.copy(cp);
                    controls.target.copy(ct);
                    camera.lookAt(ct);
                    if (t < 1) requestAnimationFrame(step);
                    else {
                        camera.position.copy(phase3End);
                        controls.target.copy(targetLook);
                        camera.lookAt(targetLook);
                        animating = false;
                        document.getElementById('hint').textContent = '📖 点击书本 · 翻开阅读';
                        document.getElementById('hint').classList.remove('hidden');
                    }
                }
                step();
            }

            function enterFlipMode(book) {
                if (isFlipping || isClosing) return;
                isFlipping = true;
                flipMode = 'auto';
                viewReset = false;
                document.getElementById('hint').classList.add('hidden');
                book.visible = false;
                book.userData.isOpen = true;
                setupFlipbook(book);
                document.getElementById('flipbook-overlay').classList.add('active');
                document.getElementById('close-hotzone').style.display = 'block';
                const camPos = new THREE.Vector3(0, 2.8, 2.95);
                const start = Date.now();

                function anim() {
                    const t = Math.min((Date.now() - start) / 400, 1);
                    camera.position.lerpVectors(camera.position, camPos, 1 - Math.pow(1 - t, 3));
                    controls.target.lerp(deskTargetPos, 1 - Math.pow(1 - t, 3));
                    camera.lookAt(controls.target);
                    if (t < 1) requestAnimationFrame(anim);
                }
                anim();
            }

            function triggerClose() {
                if (isClosing) return;
                isClosing = true;
                stopAutoFlip();
                const fanWrapper = document.querySelector('#fan-close-layer .fan-wrapper');
                fanWrapper.innerHTML = '';
                const pages = bookOnDesk.userData.pages.slice(0, 7);
                pages.forEach(src => {
                    const d = document.createElement('div');
                    d.className = 'fan-page';
                    const img = document.createElement('img');
                    img.src = src;
                    d.appendChild(img);
                    fanWrapper.appendChild(d);
                });
                document.getElementById('fan-close-layer').classList.add('active');
                document.getElementById('flipbook-overlay').classList.remove('active');
                requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('fan-close-layer')
                    .classList.add('closing')));
                setTimeout(() => {
                    document.getElementById('fan-close-layer').classList.remove('active', 'closing');
                    fanWrapper.innerHTML = '';
                    isFlipping = false;
                    isClosing = false;
                    document.getElementById('close-hotzone').style.display = 'none';
                    if (bookOnDesk) {
                        bookOnDesk.visible = true;
                        bookOnDesk.userData.isOpen = false;
                        bookOnDesk.position.copy(deskTargetPos);
                        bookOnDesk.rotation.set(-Math.PI / 2, 0, 0);
                        bookOnDesk.scale.set(1, 1, 1);
                    }
                    const targetLook = deskTargetPos.clone();
                    const camEnd = new THREE.Vector3(0, 3.2, 3.0);
                    const sPos = camera.position.clone(),
                        sTgt = controls.target.clone();
                    const d = 500,
                        sT = Date.now();

                    function back() {
                        const t = Math.min((Date.now() - sT) / d, 1);
                        const e = 1 - Math.pow(1 - t, 3);
                        camera.position.lerpVectors(sPos, camEnd, e);
                        controls.target.lerpVectors(sTgt, targetLook, e);
                        camera.lookAt(controls.target);
                        if (t < 1) requestAnimationFrame(back);
                        else {
                            document.getElementById('hint').textContent = '📖 双击书本复位 · 单击桌面空白处复原视角';
                            document.getElementById('hint').classList.remove('hidden');
                            viewReset = false;
                        }
                    }
                    back();
                }, 900);
            }

            function resetViewOnly() {
                if (animating || isFlipping || isClosing || !bookOnDesk || !isZoomed) return;
                animating = true;
                isZoomed = false;
                viewReset = true;
                document.getElementById('hint').classList.add('hidden');
                const initPos = new THREE.Vector3(7, 4.5, 10),

                const sPos = camera.position.clone(),
                    sTgt = controls.target.clone();
                const d = 900,

                function step() {
                    const t = Math.min((Date.now() - sT) / d, 1);
                    const e = 1 - Math.pow(1 - t, 3);
                    camera.position.lerpVectors(sPos, initPos, e);
                    controls.target.lerpVectors(sTgt, initTarget, e);
                    camera.lookAt(controls.target);
                    if (t < 1) requestAnimationFrame(step);
                    else {
                        camera.position.copy(initPos);
                        controls.target.copy(initTarget);
                        camera.lookAt(initTarget);
                        animating = false;
                        document.getElementById('hint').textContent = '📖 双击书本使其归位';
                        document.getElementById('hint').classList.remove('hidden');

            function resetBook() {
                if (animating || !bookOnDesk || isFlipping || isClosing) return;
                animating = true;
                isZoomed = false;
                viewReset = false;
                document.getElementById('hint').classList.add('hidden');
                const book = bookOnDesk;
                const homePos = book.userData.homePos.clone();
                const startPos = book.position.clone();
                const dur = 1400,
                    start = Date.now();
                const arcH = 0.85;

                function step() {
                    const t = Math.min((Date.now() - start) / dur, 1);
                    const ease = 1 - Math.pow(1 - t, 2);
                    const x = startPos.x + (homePos.x - startPos.x) * ease;
                    const z = startPos.z + (homePos.z - startPos.z) * ease;
                    const y = startPos.y + (homePos.y - startPos.y) * ease + Math.sin(t * Math.PI) * arcH;
                    book.position.set(x, y, z);
                    book.rotation.x = (-Math.PI / 2) * (1 - ease);
                    book.rotation.y = 0;
                    book.rotation.z = 0;
                    const s = 1 + (1 - ease) * 0.02;
                    book.scale.set(s, s, s);
                    if (t < 1) requestAnimationFrame(step);
                    else {
                        book.position.copy(homePos);
                        book.rotation.set(0, 0, 0);
                        book.scale.set(1, 1, 1);
                        book.userData.isOnDesk = false;
                        book.userData.isOpen = false;
                        bookOnDesk = null;
                        animating = false;
                        const initPos = new THREE.Vector3(7, 4.5, 10),
                            initTarget = new THREE.Vector3(0, 2.2, 0);
                        const camS = camera.position.clone(),
                            tgtS = controls.target.clone();
                        const cd = 1000,
                            cst = Date.now();

                        function camStep() {
                            const p = Math.min((Date.now() - cst) / cd, 1);
                            const pe = 1 - Math.pow(1 - p, 3);
                            camera.position.lerpVectors(camS, initPos, pe);
                            controls.target.lerpVectors(tgtS, initTarget, pe);
                            camera.lookAt(controls.target);
                            if (p < 1) requestAnimationFrame(camStep);
                            else {
                                camera.position.copy(initPos);
                                controls.target.copy(initTarget);
                                camera.lookAt(initTarget);
                                document.getElementById('hint').textContent = '📖 点击书架上的书本 · 取出阅读';
                                document.getElementById('hint').classList.remove('hidden');
                            }
                        }
                        camStep();
                    }
                }
                step();
            }

            // ================================================================
            //  十九、收音机视角动画
            // ================================================================
            function zoomToRadio() {
                if (animating || radioActive || audioMode) return;
                animating = true;
                radioActive = true;
                radioGroup.userData.isActive = true;
                document.getElementById('hint').classList.add('hidden');
                const rwp = new THREE.Vector3();
                radioGroup.getWorldPosition(rwp);
                const initPos = camera.position.clone(),
                    initTarget = controls.target.clone();
                const p1Pos = new THREE.Vector3(initPos.x * 0.55, initPos.y * 0.7, initPos.z * 0.55),
                    p1Tgt = new THREE.Vector3(0, 2.0, 2.5);
                const p2Pos = new THREE.Vector3(rwp.x + 1.2, rwp.y + 0.9, rwp.z + 2.5),
                    p2Tgt = rwp.clone();
                const fPos = new THREE.Vector3(rwp.x + 0.65, rwp.y + 0.25, rwp.z + 1.4),
                    fTgt = rwp.clone();
                const td = 2400,
                    st = Date.now();

                function step() {
                    const t = Math.min((Date.now() - st) / td, 1);
                    let cp, ct;
                    if (t < 0.3) {
                        const p = t / 0.3;
                        const e = 1 - Math.pow(1 - p, 3);
                        cp = new THREE.Vector3().lerpVectors(initPos, p1Pos, e);
                        ct = new THREE.Vector3().lerpVectors(initTarget, p1Tgt, e);
                    } else if (t < 0.65) {
                        const p = (t - 0.3) / 0.35;
                        const e = 1 - Math.pow(1 - p, 3);
                        cp = new THREE.Vector3().lerpVectors(p1Pos, p2Pos, e);
                        ct = new THREE.Vector3().lerpVectors(p1Tgt, p2Tgt, e);
                    } else {
                        const p = (t - 0.65) / 0.35;
                        const e = 1 - Math.pow(1 - p, 3);
                        cp = new THREE.Vector3().lerpVectors(p2Pos, fPos, e);
                        ct = new THREE.Vector3().lerpVectors(p2Tgt, fTgt, e);
                    }
                    if (t >= 0.65) {
                        const fp = (t - 0.65) / 0.35;            // 第三步内渐隐进度 0→1（占满第三步时长，不超出）
                        const op = Math.max(0, 1 - fp);
                        radioBodyMats[1].opacity = op;          // 左面(-X)随第三步渐隐
                        radioBodyMats[2].opacity = op;          // 顶面(+Y)随第三步渐隐
                    }
                    camera.position.copy(cp);
                    controls.target.copy(ct);
                    camera.lookAt(ct);
                    if (t < 1) requestAnimationFrame(step);
                    else {
                        camera.position.copy(fPos);
                        controls.target.copy(fTgt);
                        camera.lookAt(fTgt);
                        animating = false;
                        document.getElementById('hint').textContent = '📻 点击收音机 · 开始播放音频';
                        document.getElementById('hint').classList.remove('hidden');
                    }
                }
                step();
            }

            function resetRadioView() {
                if (animating || !radioActive || audioMode) return;
                animating = true;
                radioActive = false;
                radioGroup.userData.isActive = false;
                document.getElementById('hint').classList.add('hidden');
                const initPos = new THREE.Vector3(7, 4.5, 10),
                    initTarget = new THREE.Vector3(0, 2.2, 0);
                const sPos = camera.position.clone(),
                    sTgt = controls.target.clone();
                const d = 1000,
                    st = Date.now();

                function step() {
                    radioBodyMats[1].visible = true;    // 退出收音机视角：恢复左面粉色
                    radioBodyMats[2].visible = true;    // 退出收音机视角：恢复顶面粉色
                    radioBodyMats[1].opacity = 1;       // 退出收音机视角：恢复不透明
                    radioBodyMats[2].opacity = 1;       // 退出收音机视角：恢复不透明
                    const t = Math.min((Date.now() - st) / d, 1);
                    const e = 1 - Math.pow(1 - t, 3);
                    camera.position.lerpVectors(sPos, initPos, e);
                    controls.target.lerpVectors(sTgt, initTarget, e);
                    camera.lookAt(controls.target);
                    if (t < 1) requestAnimationFrame(step);
                    else {
                        camera.position.copy(initPos);
                        controls.target.copy(initTarget);
                        camera.lookAt(initTarget);
                        animating = false;
                        document.getElementById('hint').textContent = '🖥️ 点击电脑 · 查看详情 | 📻 点击收音机 · 收听音频';
                        document.getElementById('hint').classList.remove('hidden');
                    }
                }
                step();
            }

            // ================================================================
            //  二十、事件监听
            // ================================================================
            const raycaster = new THREE.Raycaster(),
                pointer = new THREE.Vector2();

            function getInteractionIntersect(event) {
                const rect = renderer.domElement.getBoundingClientRect();
                pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                const targets = [];
                books.forEach(b => b.traverse(c => {
                    if (c.isMesh) {
                        c.userData.parentBook = b;
                        targets.push(c);
                    }
                }));
                computerGroup.traverse(c => {
                    if (c.isMesh && c.userData.isComputerPart) {
                        c.userData.parentComputer = computerGroup;
                        targets.push(c);
                    }
                });
                radioGroup.traverse(c => {
                    if (c.isMesh && c.userData.isRadioPart) {
                        c.userData.parentRadio = radioGroup;
                        targets.push(c);
                    }
                });
                deskGroup.children.forEach(c => {
                    if (c.isMesh && !c.userData.isComputerPart && !c.userData.isRadioPart) {
                        c.userData.isDeskPart = true;
                        targets.push(c);
                    }
                });
                const hits = raycaster.intersectObjects(targets);
                if (hits.length > 0) {
                    const obj = hits[0].object;
                    return {
                        object: obj,
                        parentBook: obj.userData.parentBook || null,
                        parentComputer: obj.userData.parentComputer || null,
                        parentRadio: obj.userData.parentRadio || null,
                        isDeskPart: obj.userData.isDeskPart || false,
                        isComputerScreen: obj.userData.isComputerScreen || false
                    };
                }
                return null;
            }

            renderer.domElement.addEventListener('mousemove', e => {
                if (animating || isFlipping || isClosing) { container.classList.remove('pointing'); return; }
                const hit = getInteractionIntersect(e);
                if (hit && (hit.parentBook || hit.parentComputer || hit.parentRadio)) container.classList.add(
                    'pointing');
                else if (bookOnDesk && isZoomed && hit && hit.isDeskPart) container.classList.add('pointing');
                else container.classList.remove('pointing');
            });

            renderer.domElement.addEventListener('click', e => {
                if (animating || isFlipping || isClosing) return;
                const hit = getInteractionIntersect(e);
                if (hit && hit.parentBook && !hit.parentBook.userData.isOnDesk) {
                    takeBookToDesk(hit.parentBook);
                    return;
                }
                if (hit && hit.parentBook && hit.parentBook === bookOnDesk && hit.parentBook.userData
                    .isOnDesk && !isZoomed && !viewReset && !computerActive && !radioActive) {
                    zoomToBook(hit.parentBook);
                    return;
                }
                if (hit && hit.parentBook && hit.parentBook === bookOnDesk && hit.parentBook.userData
                    .isOnDesk && isZoomed && !viewReset) {
                    enterFlipMode(hit.parentBook);
                    return;
                }
                if (hit && hit.parentComputer && !computerActive && !videoMode && !bookOnDesk) {
                    zoomToComputer();
                    return;
                }
                if (hit && hit.parentComputer && hit.isComputerScreen && computerActive && !videoMode && !
                    animating) {
                    enterVideoMode();
                    return;
                }
                if (hit && hit.parentComputer && computerActive && videoMode && !animating) return;
                if (hit && hit.parentRadio && !radioActive && !audioMode && !bookOnDesk && !computerActive) {
                    zoomToRadio();
                    return;
                }
                if (hit && hit.parentRadio && radioActive && !audioMode && !animating) {
                    enterAudioMode();
                    return;
                }
                if (bookOnDesk && isZoomed && !viewReset && hit && hit.isDeskPart && !hit.parentBook && !hit
                    .parentComputer && !hit.parentRadio) {
                    resetViewOnly();
                    return;
                }
                if (computerActive && !videoMode && !animating && hit && !hit.parentComputer && !hit.parentRadio &&
                    !hit.parentBook) {
                    resetComputerView();
                    return;
                }
                if (radioActive && !audioMode && !animating && hit && !hit.parentRadio && !hit.parentComputer && !hit
                    .parentBook) {
                    resetRadioView();
                    return;
                }
            });

            renderer.domElement.addEventListener('dblclick', e => {
                if (animating || isFlipping || isClosing) return;
                const hit = getInteractionIntersect(e);
                if (hit && hit.parentBook && hit.parentBook === bookOnDesk && hit.parentBook.userData
                    .isOnDesk) {
                    resetBook();
                }
                if (hit && hit.parentComputer && computerActive && !videoMode) {
                    resetComputerView();
                }
                if (hit && hit.parentRadio && radioActive && !audioMode) {
                    resetRadioView();
                }
            });

            document.getElementById('close-hotzone').addEventListener('mouseenter', triggerClose);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            window.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    if (videoMode) exitVideoMode();
                    else if (audioMode) exitAudioMode();
                    else if (computerActive && !animating) resetComputerView();
                    else if (radioActive && !animating) resetRadioView();
                    else if (isZoomed && bookOnDesk && !animating) resetViewOnly();
                }
            });

            // ================================================================
            //  二十一、粒子系统与地面阴影
            // ================================================================
            const particleCount = 300; // 光粒数量增加（原100→150→300）
            const particleGeo = new THREE.BufferGeometry();
            const posArr = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i++) {
                posArr[i] = (Math.random() - 0.5) * 10;
                if (i % 3 === 1) posArr[i] += 2.5;
                if (i % 3 === 2) posArr[i] -= 0.5;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            const particleMat = new THREE.PointsMaterial({
                color: 0xffddbb,
                size: 0.045, // 光粒略增大
                transparent: true,
                opacity: 0.22,
                blending: THREE.AdditiveBlending,
            });
            const particleSys = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSys);

            function floatParticles() {
                const pos = particleSys.geometry.attributes.position.array;
                const time = Date.now() * 0.0003;
                for (let i = 0; i < particleCount; i++) {
                    const idx = i * 3;
                    pos[idx + 1] += Math.sin(time + i) * 0.0003;
                    pos[idx] += Math.cos(time * 0.7 + i * 0.5) * 0.0003;
                }
                particleSys.geometry.attributes.position.needsUpdate = true;
                requestAnimationFrame(floatParticles);
            }
            floatParticles();

            const floorShadow = new THREE.Mesh(
                new THREE.PlaneGeometry(14, 10),
                new THREE.ShadowMaterial({ opacity: 0.3 })
            );
            floorShadow.rotation.x = -Math.PI / 2;
            floorShadow.position.set(0, -0.65, 0.5);
            floorShadow.receiveShadow = true;
            scene.add(floorShadow);

            // ================================================================
            //  物品底部柔光接触阴影（手绘椭圆，不改动原有投影/灯光设置）
            // ================================================================
            function makeSoftShadowTexture() {
                const c = document.createElement('canvas');
                c.width = c.height = 128;
                const ctx = c.getContext('2d');
                const g = ctx.createRadialGradient(64, 64, 3, 64, 64, 62);
                g.addColorStop(0, 'rgba(0,0,0,0.60)');
                g.addColorStop(0.55, 'rgba(0,0,0,0.32)');
                g.addColorStop(1, 'rgba(48,48,58,0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(64, 64, 62, 0, Math.PI * 2); ctx.fill();
                return new THREE.CanvasTexture(c);
            }
            const softShadowTex = makeSoftShadowTexture();
            function addContactShadow(x, y, z, rx, rz) {
                const m = new THREE.Mesh(
                    new THREE.CircleGeometry(1, 36),
                    new THREE.MeshBasicMaterial({ map: softShadowTex, transparent: true, depthWrite: false })
                );
                m.rotation.x = -Math.PI / 2;
                m.scale.set(rx, rz, 1);
                m.position.set(x, y, z);
                m.renderOrder = -10;
                scene.add(m);
                return m;
            }
            // 抱枕：底部中心，左右略超出（不超过多）
            addContactShadow(3.05, 0.08, 2.47, 0.56, 0.22);  // 抱枕：稍微左移
            // 吉他：底部偏左，左缘不超出左上尖端垂线(worldX≈-3.428)
            addContactShadow(-3.55, -0.22, 2.8, 0.80, 0.40);  // 吉他：缩小一圈
            // 奶茶杯：左后方直线延伸至桌面后沿(z=3.9)，顶点对齐杯盖最左端点(worldX=0.75)
            addContactShadow(0.84, -0.22, 1.93, 0.24, 0.20);  // 奶茶：往右下方移一点

            // ================================================================
            //  二十二、渲染循环
            // ================================================================
            function animate() {
                requestAnimationFrame(animate);
                if (!isFlipping && !isClosing) controls.update();
                if (computerGroup.userData.isActive || computerGroup.userData.isVideoMode) updateComputerScreenWorldPos();
                renderer.render(scene, camera);
            }
            animate();

            console.log('📚 3D 书房已就绪 — 智能页面布局已启用');
            console.log('🖥️ 3D电脑模型已更新：灰色底座 + 粉色Xice屏幕（匹配上传图片）');
            console.log('📻 3D收音机模型已创建，位于桌面左下方中间，朝向电脑');
            console.log('🎛️ 收音机UI已升级：滑动电位器(速度+音量)、律动方块、喇叭、单曲循环');
            console.log('🎬 视频播放功能已就绪，支持切换、音量调节、关机、单曲循环、目录');
            console.log('🎵 音频播放功能已扩展：');
            console.log('  • 分类按钮：音乐 / 博客 / 语音（点击后搜索和内容相应过滤）');
            console.log('  • 进度条滑块：粉色的雪糕logo样式（包含圆环、斜线、三条竖线）');
            console.log('  • 频谱图样式调节按钮：点击弹出半透明玻璃浮窗，可调节背景样式、边框样式、频谱图样式');
            console.log('  • 频谱图支持水平/垂直点亮、单个小方块/整体方柱、颜色自定义（单个/批量）');
            console.log('💡 提示：ESC键可快速退出视频/音频模式或复位视角');
        })();
    </script>
